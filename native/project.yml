name: DeepSeekNative
options:
  bundleIdPrefix: com.aicd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DeepSeekNative:
    type: application
    platform: iOS
    sources:
      - path: DeepSeekNative
      - path: Shared
    entitlements:
      path: DeepSeekNative/Entitlements/DeepSeekNative.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aicd.deepseeknative
    info:
      path: DeepSeekNative/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 语音对话需要使用麦克风，录音会上传到你配置的 DeepSeek API 服务转写为文字。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: 连接本机的调试服务
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.aicd.deepseeknative
            CFBundleURLSchemes:
              - deepseeknative
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicd.deepseeknative
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DeepSeekWidgets
        embed: true
      - target: DeepSeekShareExt
        embed: true
    scheme:
      testTargets: []

  DeepSeekWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aicd.deepseeknative
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DeepSeek
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicd.deepseeknative.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  DeepSeekShareExt:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExt
      - path: Shared
    info:
      path: ShareExt/Info.plist
      properties:
        CFBundleDisplayName: 问 DeepSeek
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    entitlements:
      path: ShareExt/ShareExt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.aicd.deepseeknative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicd.deepseeknative.share
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
