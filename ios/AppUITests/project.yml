name: AppUITests
options:
  bundleIdPrefix: com.aicd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicd.deepseekchat.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "5.0"
schemes:
  AppUITests:
    build:
      targets:
        AppUITests: test
    test:
      targets:
        - AppUITests
